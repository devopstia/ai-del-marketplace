# Plan only the units a pull request changes (Terragrunt 1.x --filter-affected), with GitHub OIDC (no stored AWS keys).
# The plan output is posted on the pull request; the AI review job (lesson 8.2) adds its comment; a person approves.
name: terragrunt-plan
on:
  pull_request:
    paths: ["aws/**", "modules/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TG_NON_INTERACTIVE: "true"
  TG_NO_TIPS: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --filter-affected compares main...HEAD
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Install Terragrunt 1.2.3 (checksum verified)
        run: |
          curl -fsSLO https://github.com/gruntwork-io/terragrunt/releases/download/v1.2.3/terragrunt_linux_amd64
          curl -fsSLO https://github.com/gruntwork-io/terragrunt/releases/download/v1.2.3/SHA256SUMS
          grep " terragrunt_linux_amd64$" SHA256SUMS | sha256sum -c -
          sudo install terragrunt_linux_amd64 /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: terragrunt hcl fmt --check
      - name: Plan the affected units
        working-directory: aws/live
        run: terragrunt run --all --filter-affected -- plan -no-color -lock-timeout=5m 2>&1 | tee plan.txt
      - name: Comment the plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('aws/live/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "### Terragrunt plan (affected units)\n```\n" + plan + "\n```"
            });
