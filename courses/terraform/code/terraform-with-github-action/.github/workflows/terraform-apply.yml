# Apply only after merge to main AND a reviewer's approval of the "production" environment
# (Settings > Environments > production > Required reviewers). Never auto-apply without a person.
name: terraform-apply
on:
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=ci-demo/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="use_lockfile=true"
      - run: terraform apply -input=false -auto-approve
