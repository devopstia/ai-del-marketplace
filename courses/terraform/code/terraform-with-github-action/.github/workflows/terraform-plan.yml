# Plan on every pull request; the plan is posted as a PR comment for a human to review.
name: terraform-plan
on:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write # OIDC token for AWS
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=ci-demo/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="use_lockfile=true"
      - run: terraform validate
      - run: terraform plan -input=false -no-color -out=plan.out
      - run: terraform show -no-color plan.out > plan.txt
      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "### Terraform plan\n```\n" + plan + "\n```"
            });
