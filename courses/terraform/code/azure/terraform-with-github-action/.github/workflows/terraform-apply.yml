name: terraform-apply
on:
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="resource_group_name=rg-del-training-tfstate" -backend-config="storage_account_name=${{ vars.TF_STATE_ACCOUNT }}" -backend-config="container_name=tfstate" -backend-config="key=ci-demo.tfstate" -backend-config="use_azuread_auth=true" -backend-config="use_oidc=true"
      - run: terraform apply -input=false -auto-approve
