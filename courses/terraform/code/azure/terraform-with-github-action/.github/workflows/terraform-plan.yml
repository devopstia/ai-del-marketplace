name: terraform-plan
on:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="resource_group_name=rg-del-training-tfstate" -backend-config="storage_account_name=${{ vars.TF_STATE_ACCOUNT }}" -backend-config="container_name=tfstate" -backend-config="key=ci-demo.tfstate" -backend-config="use_azuread_auth=true" -backend-config="use_oidc=true"
      - run: terraform validate
      - run: terraform plan -input=false -no-color -out=plan.out
      - run: terraform show -no-color plan.out > plan.txt
      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "### Terraform plan\n```\n" + plan + "\n```"
            });
