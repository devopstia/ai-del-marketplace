<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fa">
<title>You're offline · DevOps Easy Learning</title>
<style>
  :root { color-scheme: light; --bg:#f4f5fa; --ink:#141833; --ink2:#2d3252; --muted:#5a6079; --btn:#4f3fb0; --on:#fff; --focus:#1e9bd7; }
  :root.dark { color-scheme: dark; --bg:#0c0f22; --ink:#e8eaf7; --ink2:#c9cce3; --muted:#9599b8; --btn:#9d8fff; --on:#12103a; --focus:#58c3f2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 26rem; }
  h1 { font-size: 1.75rem; line-height: 1.15; margin: 20px 0 8px; letter-spacing: -.02em; }
  p { color: var(--ink2); margin: 0; }
  button { margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--btn); color: var(--on); font: 700 1rem system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  small { display: block; margin-top: 14px; color: var(--muted); }
</style>
<script>try{if(localStorage.getItem("del-theme-v2")==="dark"){document.documentElement.classList.add("dark");document.querySelector("meta[name=theme-color]").content="#0c0f22"}}catch(e){}</script>
</head>
<body>
<main>
  <svg role="img" aria-label="DevOps Easy Learning" width="72" height="72" viewBox="0 0 120 120"><rect width="120" height="120" rx="26" fill="#1b1f45"/><g transform="translate(14 37) scale(.77)" fill="none" stroke-width="11" stroke-linecap="round"><path d="M60,30 C48,14 34,8 22,10 C10,12 4,22 4,30 C4,38 10,48 22,50 C34,52 48,46 60,30" stroke="#9d8fff"/><path d="M60,30 C72,46 86,52 98,50 C110,48 116,38 116,30 C116,22 110,12 98,10 C86,8 72,14 60,30" stroke="#58c3f2"/></g></svg>
  <h1>You're offline</h1>
  <p>DevOps Easy Learning needs a connection to load your courses. Your progress is saved on your account.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>This page reloads by itself when you're back online.</small>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
