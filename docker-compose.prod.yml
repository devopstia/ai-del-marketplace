# One marketplace stack (production or staging) on the EC2 server (docs/DEPLOYMENT.md).
#   STACK=production|staging, IMAGE_TAG, ECR_REGISTRY come from the release script; secrets from ./<stack>/.env
#   (written from SSM Parameter Store at each release, root-only). Database: Amazon RDS. Files: S3 via the
#   instance role. The shared Caddy front (deploy/edge.compose.yml) reaches these containers on the "edge" network.
# No geographic blocking anywhere: the marketplace is global, Africa included (AGENTS.md rule 23).
x-app: &app
  image: ${ECR_REGISTRY}/del-marketplace/api:${IMAGE_TAG}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: aws
    S3_PUBLIC_ENDPOINT: aws
  logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

services:
  api:
    <<: *app
    command: ["sh", "-c", "prisma migrate deploy && node dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on: [redis]
    networks:
      default: {}
      edge: { aliases: ["${STACK}-api"] }

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    depends_on:
      api: { condition: service_healthy }

  web:
    image: ${ECR_REGISTRY}/del-marketplace/web:${IMAGE_TAG}-${STACK}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000/api
      WEB_URL: https://${PUBLIC_HOST}
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }
    networks:
      default: {}
      edge: { aliases: ["${STACK}-web"] }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

volumes:
  redisdata:

networks:
  edge:
    external: true
