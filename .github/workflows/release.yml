# Release (docs/DEPLOYMENT.md "Release"), the Insurance Hub flow adapted to the marketplace:
#   full CI → images to ECR (scanned) → staging release + checks → approval in the `production` environment →
#   RDS snapshot → production release through SSM Run Command (no SSH) → HTTPS health check → keep 5 snapshots.
# Runs by hand ("Run workflow") and only when the repository variable PRODUCTION_ENABLED is "true".
# A failed test, scan or health check stops the release. Rollback: run it with `commit` = an earlier release.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Redeploy this earlier commit (rollback); leave empty to release the selected branch
        required: false
        default: ""

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    if: vars.PRODUCTION_ENABLED == 'true' && inputs.commit == ''
    uses: ./.github/workflows/ci.yml

  images:
    if: vars.PRODUCTION_ENABLED == 'true' && inputs.commit == ''
    needs: ci
    uses: ./.github/workflows/images.yml

  staging:
    needs: [ci, images]
    if: always() && !cancelled() && vars.PRODUCTION_ENABLED == 'true' && (inputs.commit != '' || (needs.ci.result == 'success' && needs.images.result == 'success'))
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    outputs: { tag: "${{ steps.which.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: which
        run: |
          if [ -n "${{ inputs.commit }}" ]; then git checkout --quiet "${{ inputs.commit }}"; fi
          sha="$(git rev-parse HEAD)"; echo "tag=${sha::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/del-marketplace-gh-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./scripts/deploy-aws.sh release staging ${{ steps.which.outputs.tag }}
      - run: ./scripts/deploy-aws.sh verify staging

  production:
    needs: staging
    if: always() && !cancelled() && needs.staging.result == 'success'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env: { RDS: del-marketplace-rds, KEEP_SNAPSHOTS: "5" }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/del-marketplace-gh-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - name: Snapshot the database
        run: |
          name="pre-release-${{ needs.staging.outputs.tag }}-$(date -u +%Y%m%d-%H%M)"
          aws rds create-db-snapshot --db-instance-identifier "$RDS" --db-snapshot-identifier "$name" --query DBSnapshot.Status --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "$name"
      - run: ./scripts/deploy-aws.sh release production ${{ needs.staging.outputs.tag }}
      - run: ./scripts/deploy-aws.sh verify production
      - name: Keep the newest snapshots
        if: always()
        run: |
          aws rds describe-db-snapshots --db-instance-identifier "$RDS" --snapshot-type manual \
            --query "reverse(sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier,'pre-release-')],&SnapshotCreateTime))[${KEEP_SNAPSHOTS}:].DBSnapshotIdentifier" --output text |
            tr '\t' '\n' | while read -r s; do [ -n "$s" ] && aws rds delete-db-snapshot --db-snapshot-identifier "$s" >/dev/null && echo "deleted $s"; done
