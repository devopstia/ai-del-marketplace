# Build and push the release images to Amazon ECR (docs/DEPLOYMENT.md), like Insurance Hub's images.yml:
# tag = first 12 characters of the commit, built natively for arm64 (Graviton), AWS access through GitHub OIDC
# (no stored AWS keys). Pushing is OFF until the owner approves production: repository variable
# PRODUCTION_ENABLED must be "true" and AWS_ACCOUNT_ID / AWS_REGION must be set.
name: images

on:
  workflow_call:
    outputs:
      tag: { description: Image tag, value: "${{ jobs.tag.outputs.tag }}" }
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs: { tag: "${{ steps.t.outputs.tag }}" }
    steps:
      - id: t
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile, args: "" }
          - { name: web, dockerfile: apps/web/Dockerfile, args: "NEXT_PUBLIC_API_URL=https://${{ vars.PUBLIC_HOST }}/api" }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/del-marketplace-gh-images
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/del-marketplace/${{ matrix.name }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
