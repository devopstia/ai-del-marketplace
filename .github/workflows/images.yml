# Build and push release images to Amazon ECR (docs/DEPLOYMENT.md), following Insurance Hub's images.yml: tag = first
# 12 characters of the commit; AWS access through GitHub OIDC (no stored keys). One API image and one web image per
# stack (the browser API address is built into the web app). Scans on push in ECR; critical findings block the release.
name: images

on:
  workflow_call:
    outputs:
      tag: { description: Image tag, value: "${{ jobs.build.outputs.tag }}" }
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs: { tag: "${{ steps.t.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/del-marketplace-gh-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Version already published? (tags are immutable)
        id: have
        run: |
          t=${{ steps.t.outputs.tag }}
          if aws ecr describe-images --repository-name del-marketplace/api --image-ids imageTag=$t >/dev/null 2>&1 \
            && aws ecr describe-images --repository-name del-marketplace/web --image-ids imageTag=$t-staging imageTag=$t-production >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Images for $t already exist: reusing them (never overwritten)."
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.skip != 'true'
      - name: API and worker
        if: steps.have.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: true, tags: "${{ steps.ecr.outputs.registry }}/del-marketplace/api:${{ steps.t.outputs.tag }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Web (staging)
        if: steps.have.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: true, build-args: "NEXT_PUBLIC_API_URL=https://staging.ai-devopseasylearning.com/api", tags: "${{ steps.ecr.outputs.registry }}/del-marketplace/web:${{ steps.t.outputs.tag }}-staging", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Web (production)
        if: steps.have.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: true, build-args: "NEXT_PUBLIC_API_URL=https://ai-devopseasylearning.com/api", tags: "${{ steps.ecr.outputs.registry }}/del-marketplace/web:${{ steps.t.outputs.tag }}-production", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Image scan (block on CRITICAL)
        run: |
          for repo in api; do
            aws ecr wait image-scan-complete --repository-name del-marketplace/$repo --image-id imageTag=${{ steps.t.outputs.tag }} || true
            n=$(aws ecr describe-image-scan-findings --repository-name del-marketplace/$repo --image-id imageTag=${{ steps.t.outputs.tag }} --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
            echo "$repo critical findings: $n"; [ "$n" = "None" ] || [ "$n" = "0" ]
          done
